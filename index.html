<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shivendra Kumar Roy — UI Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Poppins', 'sans-serif'],
          },
          colors: {
            paper: '#FAF8F5',
            ink: '#141413',
          },
          boxShadow: {
            'ink': '6px 6px 0px 0px #141413',
            'ink-sm': '3px 3px 0px 0px #141413',
            'ink-hover': '1px 1px 0px 0px #141413',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF8F5;
      color: #141413;
      /* Subtle dot-grid notebook texture */
      background-image: radial-gradient(#141413 0.75px, transparent 0.75px);
      background-size: 28px 28px;
    }
    .paper-surface {
      background-color: #FAF8F5;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-ink selection:text-paper relative overflow-x-hidden">

  <!-- Decorative Top-Right Ink Splatter SVG -->
  <div class="pointer-events-none fixed -top-12 -right-12 opacity-[0.07] z-0">
    <svg width="420" height="420" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="#141413">
      <path d="M107.6,23.2c12.4-2.1,26.3,4.3,35.4,13.6c9.1,9.3,13.4,21.5,19.3,33.4c5.9,11.9,13.4,23.5,11.8,35.6 c-1.6,12.1-12.3,24.7-24.1,32.7c-11.8,8-24.7,11.4-37.8,14.6c-13.1,3.2-26.4,6.2-38.3,1.8c-11.9-4.4-22.4-16.2-29.6-28.9 c-7.2-12.7-11.1-26.3-8.6-38.7c2.5-12.4,11.4-23.6,21.5-34.5C67.3,41.9,78.5,31.3,92.2,26.2C97.2,24.3,102.4,24.1,107.6,23.2z"/>
      <circle cx="38" cy="48" r="7"/>
      <circle cx="26" cy="64" r="3.5"/>
      <circle cx="165" cy="155" r="9"/>
      <circle cx="182" cy="138" r="4"/>
      <circle cx="145" cy="175" r="5"/>
      <circle cx="52" cy="168" r="6"/>
    </svg>
  </div>

  <!-- Header / Hero -->
  <header class="relative z-10 max-w-6xl mx-auto px-6 pt-16 pb-14">
    <div class="bg-white border-[3px] border-ink rounded-3xl p-8 sm:p-12 shadow-ink relative overflow-hidden">
      
      <!-- Corner Ink Blot Accent inside Header Card -->
      <svg class="w-24 h-24 text-ink opacity-10 absolute -bottom-4 -right-4 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 10 C70 8, 90 25, 88 50 C86 75, 68 92, 45 88 C22 84, 10 68, 14 44 C18 20, 30 12, 50 10 Z"/>
        <circle cx="18" cy="18" r="6"/>
        <circle cx="82" cy="16" r="4"/>
      </svg>

      <!-- Small Editorial Pill -->
      <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full border-2 border-ink bg-paper text-xs font-medium tracking-wide mb-6">
        <span class="w-2 h-2 rounded-full bg-ink"></span>
        <span>UI / UX &amp; Interactive Folio</span>
      </div>

      <!-- Name -->
      <h1 class="font-serif text-4xl sm:text-6xl font-bold tracking-tight text-ink leading-[1.1]">
        Shivendra Kumar Roy
      </h1>

      <!-- Bio with Hand-Drawn Ink Underline -->
      <p class="mt-4 text-lg sm:text-xl text-neutral-700 max-w-2xl leading-relaxed font-normal">
        Passionate about building 
        <span class="relative inline-block font-serif italic font-semibold text-ink">
          premium and professional
          <svg class="absolute -bottom-1.5 left-0 w-full h-2.5 text-ink" viewBox="0 0 200 12" fill="none" preserveAspectRatio="none">
            <path d="M2 9.5C52 2.5 148 1.5 198 8.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </span> 
        looking UI.
      </p>

      <!-- Jump Navigation Buttons -->
      <div class="mt-9 pt-7 border-t-2 border-dashed border-neutral-300 flex flex-wrap items-center gap-3.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-500 mr-2">
          Jump to Canvas:
        </span>
        <div id="jump-nav" class="flex flex-wrap gap-3"></div>
      </div>
    </div>
  </header>

  <!-- Main Projects Section -->
  <main id="projects-root" class="relative z-10 max-w-6xl mx-auto px-6 pb-24 space-y-24"></main>

  <!-- Minimal Writerly Footer -->
  <footer class="relative z-10 max-w-6xl mx-auto px-6 pb-16">
    <div class="border-t-2 border-ink pt-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-neutral-600">
      <div class="flex items-center gap-2 font-serif italic text-base text-ink">
        <span>✒</span>
        <span>Crafted by Shivendra Kumar Roy</span>
      </div>
      <a href="https://github.com/thisisRoy7" target="_blank" rel="noopener noreferrer" 
         class="px-4 py-2 rounded-xl border-2 border-ink bg-white text-ink font-medium text-xs shadow-ink-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-ink-hover transition-all">
        GitHub (@thisisRoy7) ↗
      </a>
    </div>
  </footer>

  <!-- ===================================================================== -->
  <!-- PROJECTS DATA                                                         -->
  <!-- Add more projects to this array anytime                               -->
  <!-- ===================================================================== -->
  <script>
    const PROJECTS = [
      {
        id: "price-scraper",
        name: "Price Scraper",
        subtitle: "Cross-Platform E-Commerce Comparison Workspace",
        liveUrl: "https://price-scraper-lake.vercel.app/",
        repoUrl: "https://github.com/thisisRoy7/price-scraper",
        description: "A streamlined price comparison interface that aggregates product listings from Amazon and Flipkart into a single, distraction-free view. Designed with crisp card hierarchy, side-by-side comparison blocks, and high-contrast typography so shoppers can evaluate prices and specifications at a glance.",
        highlights: [
          "Unified dual-vendor comparison layout",
          "Distilled search workflow with zero visual clutter",
          "Clean card hierarchy for rapid price scanning"
        ]
      },
      {
        id: "plant-disease",
        name: "The Botanist — Plant Disease Detector",
        subtitle: "AI Diagnostic & Botanical Inspection Interface",
        liveUrl: "https://plant-disease-detection-beta-nine.vercel.app/",
        repoUrl: "https://github.com/thisisRoy7/Plant-Disease-Detection",
        description: "An editorial, botanical-themed web interface for inspecting leaf samples and diagnosing plant diseases across 38 categories. Replaces cold machine-learning forms with collapsible sidebars, smooth scanning feedback states, and clear diagnostic cards.",
        highlights: [
          "Bespoke botanical aesthetic with layered organic textures",
          "Collapsible navigation and history sidebars",
          "Interactive upload flow with real-time scanning states"
        ]
      }
      // To add a new project later, copy-paste a block like this:
      // ,{
      //   id: "new-project",
      //   name: "Project Title",
      //   subtitle: "Short One-Line Tagline",
      //   liveUrl: "https://your-link.vercel.app/",
      //   repoUrl: "https://github.com/thisisRoy7/your-repo",
      //   description: "2-3 sentences describing what the project does and why the UI feels great.",
      //   highlights: ["Feature one", "Feature two", "Feature three"]
      // }
    ];

    function renderPortfolio() {
      const jumpNav = document.getElementById("jump-nav");
      const root = document.getElementById("projects-root");

      // Render Playful Tactile Jump Buttons
      jumpNav.innerHTML = PROJECTS.map((p, i) => `
        <a href="#${p.id}" 
           class="px-4 py-2 rounded-xl border-2 border-ink bg-paper text-ink font-medium text-sm shadow-ink-sm hover:bg-ink hover:text-paper hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-ink-hover transition-all">
          0${i + 1}. ${p.name} ↓
        </a>
      `).join("");

      // Render Project Sections
      root.innerHTML = PROJECTS.map((p, i) => `
        <section id="${p.id}" class="scroll-mt-10 space-y-6">
          
          <!-- Section Title Bar -->
          <div class="flex flex-wrap items-end justify-between gap-4">
            <div>
              <div class="inline-flex items-center gap-2 text-xs font-semibold uppercase tracking-widest text-neutral-500 mb-1">
                <span>Exhibit 0${i + 1}</span>
                <span>•</span>
                <span>${p.subtitle}</span>
              </div>
              <h2 class="font-serif text-3xl sm:text-4xl font-bold text-ink flex items-center gap-3">
                <span>${p.name}</span>
                <!-- Small Ink Drop Icon -->
                <svg class="w-5 h-5 text-ink opacity-80 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                </svg>
              </h2>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3 text-sm font-medium">
              <a href="${p.repoUrl}" target="_blank" rel="noopener noreferrer" 
                 class="px-4 py-2 rounded-xl border-2 border-ink bg-white text-ink shadow-ink-sm hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-ink-hover transition-all">
                Source Code
              </a>
              <a href="${p.liveUrl}" target="_blank" rel="noopener noreferrer" 
                 class="px-4 py-2 rounded-xl border-2 border-ink bg-ink text-paper shadow-ink-sm hover:bg-neutral-800 hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-ink-hover transition-all">
                Open Fullscreen ↗
              </a>
            </div>
          </div>

          <!-- Solid-Bounded Live Window with Rounded Corners & Ink Shadow -->
          <div class="border-[3px] border-ink rounded-2xl bg-white shadow-ink overflow-hidden">
            <!-- Minimal Browser Top Bar -->
            <div class="bg-paper border-b-[3px] border-ink px-4 py-3 flex items-center justify-between gap-4">
              <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full border-2 border-ink bg-white"></span>
                <span class="w-3.5 h-3.5 rounded-full border-2 border-ink bg-white"></span>
                <span class="w-3.5 h-3.5 rounded-full border-2 border-ink bg-ink"></span>
              </div>
              <div class="px-4 py-1 rounded-lg border-2 border-ink bg-white text-xs font-medium text-neutral-700 truncate max-w-md">
                ${p.liveUrl}
              </div>
              <button onclick="document.getElementById('iframe-${p.id}').src = document.getElementById('iframe-${p.id}').src" 
                      class="text-xs font-semibold px-3 py-1 rounded-lg border-2 border-ink bg-white hover:bg-ink hover:text-white transition-colors"
                      title="Reload Live Canvas">
                ↻ Reload
              </button>
            </div>

            <!-- Desktop Iframe -->
            <iframe 
              id="iframe-${p.id}"
              src="${p.liveUrl}" 
              title="${p.name}"
              class="w-full h-[740px] bg-white border-0 block"
              loading="lazy">
            </iframe>
          </div>

          <!-- Project Description & Field Notes Card Below Live Window -->
          <div class="bg-white border-[3px] border-ink rounded-2xl p-6 sm:p-8 shadow-ink-sm relative overflow-hidden">
            <!-- Subtle Ink Splatter Vector in Card Corner -->
            <svg class="w-28 h-28 text-ink opacity-[0.05] absolute -right-4 -bottom-4 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
              <path d="M55,15 C72,18 88,30 85,52 C82,74 62,88 42,84 C22,80 12,62 18,42 C24,22 38,12 55,15 Z"/>
              <circle cx="15" cy="28" r="5"/>
              <circle cx="84" cy="20" r="3.5"/>
              <circle cx="25" cy="82" r="4"/>
            </svg>

            <div class="grid md:grid-cols-12 gap-6 items-start relative z-10">
              <div class="md:col-span-7 space-y-2">
                <h3 class="font-serif text-lg font-bold text-ink flex items-center gap-2">
                  <span>About the Interface</span>
                </h3>
                <p class="text-sm sm:text-base text-neutral-700 leading-relaxed">
                  ${p.description}
                </p>
              </div>

              <div class="md:col-span-5 md:border-l-2 md:border-dashed md:border-neutral-300 md:pl-6 space-y-2.5">
                <h4 class="font-serif text-sm font-bold uppercase tracking-wider text-ink">
                  UI Highlights
                </h4>
                <ul class="space-y-2">
                  ${p.highlights.map(item => `
                    <li class="flex items-start gap-2.5 text-sm text-neutral-700">
                      <span class="font-serif font-bold text-ink leading-none mt-0.5">✦</span>
                      <span>${item}</span>
                    </li>
                  `).join("")}
                </ul>
              </div>
            </div>
          </div>

        </section>
      `).join("");
    }

    renderPortfolio();
  </script>
</body>
</html>
