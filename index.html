<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shivendra Kumar Roy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-black antialiased selection:bg-black selection:text-white">

  <!-- Header / Intro -->
  <header class="max-w-7xl mx-auto px-6 pt-20 pb-16 border-b border-neutral-200">
    <h1 class="font-serif text-5xl sm:text-7xl font-black tracking-tight text-black">
      Shivendra Kumar Roy
    </h1>
    <p class="mt-4 text-xl sm:text-2xl text-neutral-700 font-serif">
      Passionate about building premium and professional looking UI.
    </p>

    <!-- Jump Buttons (Auto-generated from PROJECTS array) -->
    <div id="jump-nav" class="mt-10 flex flex-wrap gap-3"></div>
  </header>

  <!-- Projects List -->
  <main id="projects-root" class="max-w-7xl mx-auto px-6 py-16 space-y-24"></main>

  <!-- ===================================================================== -->
  <!-- PROJECTS DATA                                                         -->
  <!-- Add more projects to this array anytime                               -->
  <!-- ===================================================================== -->
  <script>
    const PROJECTS = [
      {
        id: "price-scraper",
        name: "Price Scraper",
        liveUrl: "https://price-scraper-lake.vercel.app/",
        repoUrl: "https://github.com/thisisRoy7/price-scraper"
      },
      {
        id: "plant-disease",
        name: "Plant Disease Detection",
        liveUrl: "https://plant-disease-detection-beta-nine.vercel.app/",
        repoUrl: "https://github.com/thisisRoy7/Plant-Disease-Detection"
      }
      // To add a new project later, copy-paste a block like this:
      // ,{
      //   id: "new-project",
      //   name: "Project Name",
      //   liveUrl: "https://your-link.vercel.app/",
      //   repoUrl: "https://github.com/thisisRoy7/your-repo"
      // }
    ];

    function renderPortfolio() {
      const jumpNav = document.getElementById("jump-nav");
      const root = document.getElementById("projects-root");

      // Render Jump Buttons
      jumpNav.innerHTML = PROJECTS.map((p, i) => `
        <a href="#${p.id}" 
           class="px-5 py-2.5 border-2 border-black text-black font-sans font-semibold text-sm hover:bg-black hover:text-white transition-colors">
          0${i + 1}. ${p.name} ↓
        </a>
      `).join("");

      // Render Project Windows (Desktop-only)
      root.innerHTML = PROJECTS.map((p, i) => `
        <section id="${p.id}" class="scroll-mt-10 space-y-4">
          <div class="flex flex-wrap items-baseline justify-between gap-4">
            <h2 class="font-serif text-3xl sm:text-4xl font-bold text-black">
              0${i + 1}. ${p.name}
            </h2>
            <div class="flex items-center gap-4 font-sans text-sm font-medium">
              <a href="${p.repoUrl}" target="_blank" rel="noopener noreferrer" 
                 class="text-neutral-600 hover:text-black underline underline-offset-4">
                GitHub
              </a>
              <a href="${p.liveUrl}" target="_blank" rel="noopener noreferrer" 
                 class="px-4 py-1.5 bg-black text-white hover:bg-neutral-800 transition-colors">
                Open Fullscreen ↗
              </a>
            </div>
          </div>

          <!-- Desktop Frame -->
          <div class="border-2 border-black bg-neutral-50 overflow-hidden shadow-sm">
            <iframe 
              src="${p.liveUrl}" 
              title="${p.name}"
              class="w-full h-[760px] bg-white border-0"
              loading="lazy">
            </iframe>
          </div>
        </section>
      `).join("");
    }

    renderPortfolio();
  </script>
</body>
</html>
